# `publish`, `ci` and `info` are no longer built in - they come from the Node plugin.
#
# `extends`, not `plugins`: the two are different statements. `extends` brings another rmanrc in
# underneath this one, and that package's config is where its plugin, commands and publish targets
# are declared; `plugins` adds a plugin *instance* to this config and takes no package name at all.
#
# Named by path rather than as `rman-node`, and only because this repository is the plugin's own:
# the package's `exports` points at `./index.js`, which is the *published* layout (the build
# directory becomes the package root), so resolving it by name inside this checkout finds nothing.
# A consuming repository installs it normally and writes `extends: 'rman-node'`.
#
# It follows that `rman-node` has to be built before `rman publish` exists here - self-hosting a
# plugin costs exactly one bootstrap step.
extends: './packages/node/build/index.js'

# One version line for the whole repository (rman's default) - `rman` and `rman-node` release
# together, so a config written for one can never name a version of the other that does not exist.

# `[*]`, not an unmarked block: both packages, and *not* the repository root, which has no build
# directory of its own and nothing to publish. A glob names the packages below; the root is nobody's
# child, so it is reached only by an unmarked key or by `[/]`.
'[*]':
  # `publish` ships the build directory, and generates the manifest there itself.
  #
  # `publish.npm.*`, not `publish.directory`: a target's block is named after the target, the way
  # `publish.docker.*` always was. The key is the `npm` target's, contributed by `rman-node`.
  publish:
    npm:
      directory: build

  clean:
    include: ['build', '*.tsbuildinfo']
