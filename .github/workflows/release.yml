name: Release

# **rman releases itself with the rman in this commit, never with a published one.**
#
# This workflow used to call `panates/github-actions/.github/workflows/node-release.yaml@v1`,
# which is fine only because that version calls rman nowhere (measured: 0 references, against 20
# in @v2). @v2 drives the whole release with `npx rman@1` - so the day this repository follows the
# other panates repositories onto it, rman 2.x would be released by rman 1.x, which cannot even
# read this repository's own `.rmanrc.yml` (`platform`, `"[*]"`). That is the same bootstrap loop
# `npm run build` was taken off when it stopped being `rman build`, and it bites at exactly the
# moment a release is being cut.
#
# The fix is not to avoid rman - it is to avoid the *registry*. Every step below runs the CLI this
# commit builds, so the release path exercises the artifact being shipped.

on:
  # Can be run manually
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # on git push
  push:
    branches:
      - main

permissions:
  id-token: write  # Required for OIDC
  contents: read

# Only one run at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !(
            contains(github.event.head_commit.message, 'no-test') ||
            (
              startsWith(github.event.head_commit.message, 'Merge pull request') &&
              contains(github.event.head_commit.message, '/dev')
            )
          )
        )
      )
    uses: ./.github/workflows/test.yml

  release:
    name: Release
    needs: test
    # `always()` because `needs` alone would block the whole job whenever `test` is *skipped*, which
    # is the normal path for a `no-test` commit or a merge from /dev. This one condition replaces
    # the pair of mirror-image jobs that used to exist for exactly that reason - one with
    # `needs: test`, one with the test condition negated - which meant the release steps were
    # written down twice and could drift.
    if: >
      always() && !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm Trusted Publishing (OIDC)
      contents: write   # `version --push`, the tags it creates, and the GitHub Release itself

    steps:
      - uses: actions/checkout@v7
        with:
          # rman resolves each package's release boundary from its own last tag and reads the
          # commits after it, so a shallow clone silently reports the wrong thing rather than
          # failing - every package would look unreleased.
          fetch-depth: 0
          # The built-in GITHUB_TOKEN, with the `contents: write` above - `main` carries no branch
          # protection, so nothing here needs a personal token's bypass.
          #
          # It also removes a redundant run per release, rather than merely being one secret fewer:
          # a push made with GITHUB_TOKEN deliberately does **not** trigger workflows, and
          # `version --push` pushes to `main`, which is what this workflow triggers on. With a PAT
          # every release started a second run of itself - harmless (`version` finds no bump,
          # `publish` finds everything published, `github-release` reads up-to-date) but never
          # cancelled either, since `concurrency` here is `cancel-in-progress: false`. The
          # `no-release`/`no-test` guards do not catch it: a `chore(release): ...` message contains
          # neither.

      # The highest version `test.yml`'s matrix covers, which is the one to cut a release on: the
      # published artifact should be built by a runtime the suite actually ran against.
      #
      # **`registry-url` is required, and leaving it out is what broke the first real release.**
      # It was dropped on purpose and on reasoning that was correct for v4 and is explicitly wrong
      # for v7: with `registry-url` set, v4 wrote an `.npmrc` whose `_authToken` was a dummy
      # `NODE_AUTH_TOKEN` fallback, and the worry was that a placeholder token would stop npm ever
      # reaching for OIDC. v7 removed that fallback, and says so - "npm Trusted Publishing (OIDC) is
      # not affected, since it does not use NODE_AUTH_TOKEN". The official recipe sets it, and
      # `npm publish` answered `ENEEDAUTH` without it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # **No `npm install -g npm@latest`, deliberately.** It was here as insurance against a runner
      # image moving, and it moved the runner instead: Node 24.21.0 ships npm 11.19.0, comfortably
      # past the 11.5.1 that Trusted Publishing needs, and the upgrade took the job to npm **12.1.0**
      # - a major the documented recipe never contemplates, since that recipe has no upgrade step at
      # all and says Node 24 is recommended precisely because its bundled npm is new enough.
      #
      # With OIDC never engaging on 12.1.0 whether the npmrc carried an empty auth line (404) or
      # nothing at all (ENEEDAUTH), the npm version is the one variable in this job that is both
      # ours and untested. Removing it is not a fix claimed - it is a deviation withdrawn, so what
      # runs is the shape the recipe describes.

      - name: Install dependencies
        run: npm ci

      # `version` commits and tags, so the runner needs an identity of its own - it cannot be
      # handed one per command.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Written before anything mutates the repository: `version` below is the first step that
      # pushes, and an auth failure after it leaves a bump and a tag on main with nothing released.
      #
      # **The empty-credential line is the thing to remove, and it is why a release 404'd.**
      # `registry-url` makes setup-node write
      #
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      #
      # into the file it points `NPM_CONFIG_USERCONFIG` at. With no token that reference resolves to
      # nothing, and npm reads *having* an `_authToken` entry for the registry as being
      # authenticated already - so it never reaches for OIDC, sends a credential that is not one,
      # and the registry answers 404 (it returns 404 rather than 403 so nobody can probe which
      # packages exist). Measured on a real run: `NODE_AUTH_TOKEN: unset`, the line present, and
      # `npm publish` answering `404 Not Found - PUT https://registry.npmjs.org/rman`.
      #
      # Removing the line is not a workaround: an `_authToken` with nothing behind it cannot help
      # any code path, and leaving the field empty is precisely what lets npm decide it must ask
      # GitHub for an OIDC token instead. `registry=` stays, which is the half of `registry-url`
      # that is actually wanted.
      - name: Configure npm auth
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          # Stripped first and unconditionally, so a real token is never left competing with the
          # placeholder for the same registry - npm reading two `_authToken` entries is a question
          # nobody should have to answer.
          #
          # `grep -v` into a temp file rather than `sed -i`, which is not portable: BSD sed reads the
          # next word as a backup suffix, so the same line is a silent no-op on macOS - measured,
          # while checking this very step. `|| true` covers grep's exit 1 when it filters everything.
          if [ -f "$NPMRC" ]; then
            grep -v ':_authToken=' "$NPMRC" > "$NPMRC.tmp" || true
            mv "$NPMRC.tmp" "$NPMRC"
          fi
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' '${{ secrets.NPM_TOKEN }}' >> "$NPMRC"
            echo "NPM_TOKEN is set - publishing with it rather than OIDC."
          else
            echo "No NPM_TOKEN - cleared the empty auth line, so OIDC is the only credential left."
          fi

      # **Build 1 of 2: the bootstrap.** There is no rman to run `version` with until this finishes,
      # and it must not be a published one. Plain npm, in package order - never `rman build`.
      - name: Build the CLI this release will be cut with
        run: npm run build

      # Severity always comes from rman's own reading of the commits since each package's last tag
      # (conventional-commit prefixes, with a `Release-As:` footer as the one-off override) - never
      # a static input here, which would apply identically to every future run.
      # A no-op when nothing warrants a new version, so it needs no gate of its own.
      - name: Version
        run: node packages/rman/build/cli.js version --yes --push --allow-branch main

      # **Build 2 of 2: the artifact.** `support/postbuild.cjs` bakes `package.json`'s version into
      # `build/constants.js`, so a build made *before* the bump ships a CLI that reports the old
      # version. Measured: bump package.json to 9.9.9 without rebuilding and
      # `node packages/rman/build/cli.js --version` still answers the previous one.
      # Note this holds although `.rmanrc.yml` declares no `version.stamp` - what bakes the version
      # in is postbuild, not the config.
      # Nearly free: tsc is incremental, so this re-runs little more than the postbuild hooks.
      - name: Rebuild at the version that was just cut
        run: npm run build

      # **A publish failing with ENEEDAUTH has two possible causes and they need different fixes**,
      # so this prints the three facts that tell them apart rather than leaving the next reader to
      # guess. It is deliberately not conditional: the run that needs it is the one nobody expected
      # to fail, and five lines of output cost nothing.
      #
      # npm Trusted Publishing exchanges a GitHub OIDC token for a short-lived npm one *before*
      # publishing, and attempts that only when it is running in a supported CI, the id-token
      # permission reached this job, and npm is new enough (>= 11.5.1). Miss any one and npm falls
      # back to looking for a token it does not have - the message is the same either way.
      #
      #   npm too old, or OIDC vars absent  -> the cause is here, in the workflow
      #   both fine                         -> the cause is the trusted-publisher connection on npm
      #                                        (org/repo/workflow filename/environment must match
      #                                        exactly: panates / rman / release.yml / none)
      #
      # The candidate directories are printed rather than a child's `npm --version`, because
      # `rman publish` spawns its own child and `BinPath` puts every `node_modules/.bin` from the
      # package upward, plus the running node's own directory, ahead of the inherited PATH - so an
      # `npm` in any of those is what publishes, not the one this step resolves. Listing them is
      # deterministic; asking rman to exec `npm --version` is not (`exec` runs per package, and
      # `--scope /` selects nothing there - the repository's package list holds the members only).
      - name: Diagnose npm auth
        run: |
          echo "step npm:   $(npm --version)  at $(command -v npm)"
          echo "node bin:   $(dirname "$(command -v node)")"
          ls -l "$(dirname "$(command -v node)")/npm" 2>/dev/null || echo "            (no npm shim beside node)"
          ls -l node_modules/.bin/npm packages/rman/node_modules/.bin/npm 2>/dev/null \
            || echo "            (no npm in any node_modules/.bin - nothing shadows the global one)"
          # **`present`/`ABSENT` only, never the value.** `${VAR:+present}${VAR:-ABSENT}` reads as a
          # tidy one-liner and prints `present<the value>` when the variable is set - and
          # ACTIONS_ID_TOKEN_REQUEST_TOKEN is a live credential that GitHub does not mask, because it
          # is not a registered secret. Caught while checking this step locally.
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC url:   present"; else echo "OIDC url:   ABSENT"; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "OIDC token: present"; else echo "OIDC token: ABSENT"; fi
          # **As rman's child sees them**, which is the one difference left between this workflow and
          # every working report of trusted publishing: `npm publish` here is a *grandchild*, spawned
          # by `rman publish` through `exec`, which rebuilds the environment via `BinPath.env`. That
          # starts from `{ ...process.env }` and should carry both variables - reading them back from
          # an actual child is what turns "should" into "does", and it publishes nothing.
          echo "--- through rman's own spawn path:"
          node packages/rman/build/cli.js exec --scope rman -- \
            sh -c 'u=ABSENT; t=ABSENT; [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && u=present; [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && t=present; echo "child OIDC url: $u, child OIDC token: $t, child npm: $(npm --version)"' \
            || echo "  (rman exec failed - inconclusive)"
          # **What npm is actually matching a trusted publisher on.** Everything above says the
          # workflow is right, so the remaining question is whether the claims GitHub issues are the
          # ones registered on npmjs.com - and those are readable without publishing anything. The
          # token is requested with npm's own audience and never printed; only the claims are.
          echo "--- OIDC claims GitHub would issue for npm"
          node support/oidc-claims.mjs || echo "  (probe failed - inconclusive)"
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:+set}${NODE_AUTH_TOKEN:-unset}"
          echo "--- npm config (the files npm actually reads, auth values redacted)"
          for f in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" ./.npmrc; do
            if [ -f "$f" ]; then
              echo "  $f:"
              sed -e 's/\(_authToken=\).*/\1REDACTED/' -e 's/^/    /' "$f"
            else
              echo "  $f: (absent)"
            fi
          done

      # No `--target`: each package's own `.rmanrc "publish.target"` is the single source of truth.
      # Never looks at whether `version` ran - it inspects what is on disk and on the registry - so
      # a version cut locally and merged in releases exactly the same way, and re-running is safe.
      - name: Publish
        run: node packages/rman/build/cli.js publish --yes

      # After `publish`, so a failed registry push never leaves a release announcing code that
      # never arrived. A no-op when the tag already has a release.
      - name: GitHub Release
        env:
          # `GithubReleaseService` reads GITHUB_TOKEN, falling back to GH_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/rman/build/cli.js github-release --yes
