name: Test

# **Nothing here may install rman from the registry.** The setup used to be
# `panates/gh-setup-node@v1`, which runs `npm i rman -g` twice, unconditionally - so rman's own
# suite depended on the published copy of itself, and a broken or unpublishable release would have
# failed these jobs for a reason that has nothing to do with the tests. It also put a *global* rman
# on PATH while the suite ran, which is the trap the node platform's bin-path provider already
# documents: the running node's directory goes ahead of the inherited PATH, so a nested `rman`
# inside a `run` step resolves to the global one rather than the one under test.
#
# Its third habit was worse and unrelated to rman: `rm -f package-lock.json` followed by
# `npm install --no-save`, so the committed lockfile was deleted on every run and the suite never
# saw the pinned dependency tree at all.
#
# Measured before dropping it, because this machine has a global rman and every local run was made
# with one on PATH: with `rman` replaced by a stub that exits 127 and reports being called,
# `typecheck`, `lint`, `build`, `smoke` and `citest` all pass and the stub is never reached. Nothing
# in this repository's CI scripts needs a published rman - which is what "the build must not need
# rman" already says, now checked rather than assumed.
on:
  workflow_call:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches-ignore:
      - main

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ***********************************
  # Job: Type check
  # ***********************************
  # Its own job, and on one Node version: the answer does not vary by runtime, so running it in the
  # test matrix would pay for it three times.
  #
  # It exists because **nothing else checks the test tree**. `npm test` runs mocha, which transpiles
  # without type-checking, and `npm run build` compiles `src` only - so a spec could be wrong about
  # a type for as long as nobody happened to run `tsc` over `test/` by hand. That is exactly how a
  # core spec came to type its fixture with `rman-node`'s keys and nothing said so.
  typecheck:
    name: 'Type check'
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !(
          contains(github.event.head_commit.message, 'no-test') ||
          (
            startsWith(github.event.head_commit.message, 'Merge pull request') &&
            contains(github.event.head_commit.message, '/dev')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Caches npm's own download cache, keyed on the lockfile - which is the mechanism that
          # works with `npm ci`, unlike caching `node_modules` and then deleting the key it was
          # hashed from.
          cache: npm

      # `ci`, not `install`: the point of a lockfile is that CI runs the tree that was committed.
      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The suite cannot see this. Mocha resolves `rman` through `tsconfig-test.json`'s `paths` to
      # `src`, which is a different module graph from the compiled one - so an ESM cycle can be
      # fatal in `build/` with every spec green. Measured: every command in the published layout
      # died with `Cannot access 'VersionPlanService' before initialization` and nothing reported it.
      - name: Build
        run: npm run build

      - name: Smoke-test the built CLI
        run: npm run smoke

  # ***********************************
  # Job: Test
  # ***********************************
  test:
    name: 'Tests'
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !(
          contains(github.event.head_commit.message, 'no-test') ||
          ( 
            startsWith(github.event.head_commit.message, 'Merge pull request') &&
            contains(github.event.head_commit.message, '/dev')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [ '22', '23', '24' ]
    env:
      TZ: Europe/Istanbul  # Set timezone for entire job

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply tests
        run: |
          npm run citest
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '24' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
